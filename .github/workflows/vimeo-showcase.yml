name: Vimeo showcase diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vimeo-showcase.yml'
      - 'app/src/androidTest/java/de/steffen/musikmathe/VimeoShowcaseProbeTest.java'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  previous-device-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the most recent Android 16 device failure report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/actions/artifacts?name=password-device-reports-api-36&per_page=100" > /tmp/device-artifacts.json
          artifact_id=$(python3 -c 'import json; a=max((a for a in json.load(open("/tmp/device-artifacts.json"))["artifacts"] if a["name"]=="password-device-reports-api-36" and not a["expired"]),key=lambda a:a["created_at"],default=None); print(a["id"] if a else "")')
          if test -z "$artifact_id"; then exit 0; fi
          echo "DEVICE_REPORT_ARTIFACT $artifact_id"
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/device-report.zip
          python3 - <<'PY'
          import zipfile,re
          with zipfile.ZipFile('/tmp/device-report.zip') as z:
              for name in z.namelist():
                  if not name.endswith(('.xml','.txt')) or not ('AdBlockLiveProbe' in name or 'logcat' in name.lower()): continue
                  text=z.read(name).decode('utf-8','replace');lines=text.splitlines();selected=set()
                  for i,line in enumerate(lines):
                      if re.search(r'FATAL EXCEPTION|Fatal signal|SIGABRT|SIGSEGV|Process.*crash|AssertionError|RuntimeException|<failure|<error',line,re.I): selected.update(range(max(0,i-3),min(len(lines),i+45)))
                  if selected:
                      print('PREVIOUS_DEVICE_REPORT '+name)
                      for i in sorted(selected)[:220]: print(lines[i][:3000])
          PY
  chrome-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare with desktop Chrome on the same CI network
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.55.0
          mkdir -p chrome-reference
          xvfb-run -a node <<'JS'
          const fs=require('fs'),{chromium}=require('playwright-core');
          (async()=>{let browser;const report={errors:[]};try{
            browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:false,args:['--no-sandbox']});const page=await browser.newPage();
            page.on('response',r=>{if(r.status()>=400){const u=new URL(r.url());report.errors.push({status:r.status(),host:u.hostname,path:u.pathname});}});
            await page.goto('https://player.vimeo.com/video/76979871?h=8272103f6e&quality=360p',{waitUntil:'domcontentloaded',timeout:30000});
            await page.getByRole('button',{name:/^Play/}).first().click({timeout:20000});
            try{await page.waitForFunction(()=>{const v=document.querySelector('video');return v&&!v.paused&&v.currentTime>.5;},{},{timeout:20000});}catch(e){report.waitError=String(e).slice(0,300);}
            report.player=await page.evaluate(()=>{const v=document.querySelector('video');return {time:v&&v.currentTime,ready:v&&v.readyState,paused:v&&v.paused,error:v&&v.error&&v.error.code,body:document.body.innerText.slice(0,1300),agent:navigator.userAgent};});
            report.played=!!report.player&&report.player.time>.5;await page.screenshot({path:'chrome-reference/player.png'});
          }catch(e){report.error=String(e).slice(0,500);}finally{if(browser)await browser.close();fs.writeFileSync('chrome-reference/report.json',JSON.stringify(report,null,2));console.log('CHROME_VIMEO_REFERENCE '+JSON.stringify(report));}})();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vimeo-chrome-reference
          path: chrome-reference/
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Public showcase response
        run: |
          mkdir -p vimeo-diagnostics
          curl --location --max-time 30 --compressed -A 'Mozilla/5.0 (Linux; Android 13; Pixel 6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36' -o vimeo-diagnostics/showcase.html -w 'HTTP %{http_code}, bytes %{size_download}\n' https://vimeo.com/showcase/2600007
          python3 - <<'PY'
          import base64,zlib,pathlib
          value=base64.b64encode(zlib.compress(pathlib.Path('vimeo-diagnostics/showcase.html').read_bytes())).decode()
          for n in range(0,len(value),2000): print('VIMEO_HTML '+str(n//2000)+' '+value[n:n+2000])
          PY
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Compare browser features on the reported gallery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant de.steffen.musikmathe android.permission.POST_NOTIFICATIONS
            for mode in baseline; do adb logcat -c; timeout 65s adb shell am instrument -w -e class de.steffen.musikmathe.VimeoShowcaseProbeTest -e vimeoShowcaseProbe true -e vimeoProbeMode "$mode" de.steffen.musikmathe.test/androidx.test.runner.AndroidJUnitRunner > "vimeo-diagnostics/$mode-test.txt" 2>&1 || true; adb logcat -d -s VimeoShowcase:I chromium:E AndroidRuntime:E ActivityManager:E '*:S' > "vimeo-diagnostics/$mode-logcat.txt"; cat "vimeo-diagnostics/$mode-logcat.txt"; adb shell run-as de.steffen.musikmathe cat "files/vimeo-showcase-$mode.png" > "vimeo-diagnostics/$mode.png"; adb shell am force-stop de.steffen.musikmathe; done
            for mode in baseline no-adblock chrome-agent no-extras auto-quality; do adb logcat -c; timeout 70s adb shell am instrument -w -e class de.steffen.musikmathe.VimeoPlaybackDeviceTest -e vimeoLive true -e vimeoPlaybackMode "$mode" de.steffen.musikmathe.test/androidx.test.runner.AndroidJUnitRunner > "vimeo-diagnostics/playback-$mode-test.txt" 2>&1 || true; adb logcat -d -s MenuPreview:I chromium:E AndroidRuntime:E '*:S' > "vimeo-diagnostics/playback-$mode-logcat.txt"; cat "vimeo-diagnostics/playback-$mode-logcat.txt"; adb shell am force-stop de.steffen.musikmathe; done
      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vimeo-showcase-diagnostics
          path: vimeo-diagnostics/
