name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test YouTube player extraction
        run: |
          node scripts/test-youtube.js
          node scripts/test-video-scan.js
          node --check app/src/main/assets/passwords.js
          python3 scripts/compile-adblock.py
          node scripts/test-adblock.js
          node --check app/src/main/assets/free-space.js
          node --check app/src/main/assets/home-frequent.js
          node --check app/src/main/assets/preload-links.js

      - name: Build and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Show lint findings when checks fail
        if: failure()
        run: |
          if test -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bestbrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  private-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify private storage and video MP4 exports on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            bash scripts/device-tests.sh -Pandroid.testInstrumentationRunnerArguments.class=de.steffen.musikmathe.PrivateIsolationTest
            mkdir -p private-profile-device-reports
            cp -r app/build/reports/androidTests/. private-profile-device-reports/
            bash scripts/device-tests.sh -Pandroid.testInstrumentationRunnerArguments.notClass=de.steffen.musikmathe.PrivateIsolationTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class de.steffen.musikmathe.YouTubeLiveProbeTest de.steffen.musikmathe.test/androidx.test.runner.AndroidJUnitRunner
            adb shell run-as de.steffen.musikmathe cat files/youtube-probe.json
            bash scripts/cutout-test.sh
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-isolation-device-reports
          path: |
            app/build/reports/androidTests/
            private-profile-device-reports/
            app/build/outputs/androidTest-results/
            cutout-test.txt
          if-no-files-found: ignore

  passwords:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify passwords and live ad blocking on modern Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb logcat -G 16M
            bash scripts/device-tests.sh -Pandroid.testInstrumentationRunnerArguments.class=de.steffen.musikmathe.PrivateIsolationTest
            mkdir -p private-profile-device-reports
            cp -r app/build/reports/androidTests/. private-profile-device-reports/
            bash scripts/device-tests.sh -Pandroid.testInstrumentationRunnerArguments.class=de.steffen.musikmathe.PasswordFeatureTest,de.steffen.musikmathe.AdBlockingWebViewTest,de.steffen.musikmathe.AdBlockLiveProbeTest,de.steffen.musikmathe.BrowserFullscreenTest,de.steffen.musikmathe.BrowserMenuDeviceTest,de.steffen.musikmathe.NightModeDeviceTest,de.steffen.musikmathe.ProtectedContentDeviceTest,de.steffen.musikmathe.CastDeviceTest,de.steffen.musikmathe.VideoDownloadProgressTest,de.steffen.musikmathe.VideoParallelExportTest,de.steffen.musikmathe.VideoDetectionTest,de.steffen.musikmathe.AddressSuggestionsDeviceTest,de.steffen.musikmathe.HomePageDeviceTest,de.steffen.musikmathe.PreloadingDeviceTest -Pandroid.testInstrumentationRunnerArguments.adblockLive=true
            bash scripts/cutout-test.sh
      - name: Upload password test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-device-reports
          path: |
            app/build/reports/androidTests/
            private-profile-device-reports/
            app/build/outputs/androidTest-results/
            cutout-test.txt
          if-no-files-found: ignore

